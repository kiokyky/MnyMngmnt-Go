name: Go CI (Vet & Test)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    name: Run Vet & Tests with PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mny_mngmnt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Anti-Tamper Check (Protect tests, .github, and .githooks)
        if: github.actor != 'kiokyky'
        run: |
          echo "🔒 Memeriksa apakah ada commit dari selain kiokyky yang mengubah tests/, .github/, atau .githooks/..."
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi

          # Cari semua commit di dalam branch ini yang menyentuh folder terproteksi
          COMMITS=$(git log --format="%H" $RANGE -- tests/ .github/ .githooks/)
          for COMMIT in $COMMITS; do
            AUTHOR_NAME=$(git show -s --format="%an" $COMMIT)
            AUTHOR_EMAIL=$(git show -s --format="%ae" $COMMIT)
            # Izinkan hanya jika commit tersebut dibuat oleh pemilik repo (kiokyky / Leviathanzs)
            if ! echo "$AUTHOR_NAME $AUTHOR_EMAIL" | grep -Eqi "kiokyky|Leviathanzs"; then
              echo "❌ PELANGGARAN pada commit $COMMIT oleh $AUTHOR_NAME ($AUTHOR_EMAIL):"
              echo "Developer tidak diizinkan mengubah file di dalam tests/, .github/, atau .githooks/!"
              git show --stat $COMMIT -- tests/ .github/ .githooks/
              exit 1
            fi
          done
          echo "✅ Seluruh file di dalam tests/, .github/, dan .githooks/ aman (hanya diubah oleh pemilik repo)."

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run all unit & integration tests
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: mny_mngmnt
          DB_SSLMODE: disable
          JWT_SECRET: ci-test-secret
        run: go test -count=1 -v ./tests/...
