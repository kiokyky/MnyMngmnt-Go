name: Go CI (Vet & Test)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    name: Run Vet & Tests with PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mny_mngmnt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Anti-Tamper Check (Protect tests, .github, and .githooks)
        if: github.actor != 'kiokyky'
        run: |
          echo "🔒 Memeriksa apakah ada perubahan tidak sah pada folder tests/, .github/, atau .githooks/ oleh ${{ github.actor }}..."
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1...HEAD)
          fi

          PROTECTED_CHANGES=$(echo "$CHANGED_FILES" | grep -E '^(tests/|\.github/|\.githooks/)' || true)
          if [ -n "$PROTECTED_CHANGES" ]; then
            echo "❌ PELANGGARAN: Anda (${{ github.actor }}) tidak diizinkan mengubah file di dalam tests/, .github/, atau .githooks/!"
            echo "File yang terdeteksi diubah:"
            echo "$PROTECTED_CHANGES"
            exit 1
          fi
          echo "✅ Tidak ada perubahan pada folder yang dilindungi."

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run all unit & integration tests
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: mny_mngmnt
          DB_SSLMODE: disable
          JWT_SECRET: ci-test-secret
        run: go test -count=1 -v ./tests/...
